name: tests

on:
  pull_request:
    branches:
      - "19.0*"
  push:
    branches:
      - "19.0"
      - "19.0-ocabot-*"

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo19.0:latest
            name: test with Odoo
          - container: ghcr.io/oca/oca-ci/py3.10-ocb19.0:latest
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect addons
        id: detect_addons
        run: |
          if [ -n "$(find . -mindepth 2 -maxdepth 2 -name __manifest__.py -print -quit)" ]; then
            echo "has_addons=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_addons=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No addons found in repository, test steps will be skipped."
          fi
      - name: Install addons and dependencies
        if: steps.detect_addons.outputs.has_addons == 'true'
        run: oca_install_addons
      - name: Check licenses
        if: steps.detect_addons.outputs.has_addons == 'true'
        run: manifestoo -d . check-licenses
      - name: Check development status
        if: steps.detect_addons.outputs.has_addons == 'true'
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        if: steps.detect_addons.outputs.has_addons == 'true'
        run: oca_init_test_database
      - name: Run tests
        if: steps.detect_addons.outputs.has_addons == 'true'
        run: oca_run_tests
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.detect_addons.outputs.has_addons == 'true' }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}${{ join(matrix.include) }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'OCA' }}
